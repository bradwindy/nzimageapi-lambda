name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs; never cancel an in-progress main run (which may be deploying).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker-test:
    name: Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Proves the Worker bundles. Workers Builds deploys it from main (worker/ is its root).
      - run: npx wrangler deploy --dry-run --outdir dist

  python-test:
    name: Python converter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"         # matches the converter and guard Lambda runtime
      - name: Install dev deps
        run: pip install -r converter/requirements-dev.txt -r guard/requirements-dev.txt
      - name: pytest (converter)
        working-directory: converter
        run: pytest
      - name: pytest (guard)
        working-directory: guard
        run: pytest

  deploy:
    name: Build & deploy (SAM)
    needs: [python-test]                 # the Worker deploys separately, through Workers Builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm            # arm64 Python for the converter codec check
    environment: production              # gives an optional approval gate; scopes OIDC sub (see setup)
    permissions:
      id-token: write                    # required for OIDC
      contents: read
    concurrency:
      group: deploy-nzimageapi           # serialize deploys; never overlap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true            # arch-independent SAM CLI install
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"         # same as the Lambda runtime, so the codec check imports the built wheel
      - name: sam build
        run: sam build                   # converter and guard via their Makefiles
      # The converter .zip carries Pillow's manylinux aarch64 wheel. Prove the build has the two
      # codecs it exists for, on the same architecture and Python as the Lambda, before deploying.
      - name: Check converter codecs
        run: |
          PYTHONPATH=.aws-sam/build/Jp2ConverterFunction python -c "from PIL import features; assert features.check('jpg_2000'), 'OpenJPEG/JP2 NOT enabled in Pillow'; assert features.check('libtiff'), 'libtiff NOT enabled in Pillow'; print('JP2 and TIFF decoding available')"
      # The artefact bucket lives in the separate `nzimageapi-bootstrap` stack (infra/bootstrap.yaml),
      # which owns its retention lifecycle policy. Read it from that stack's outputs rather than
      # from a hand-maintained repo variable: a stale variable silently sends deploys back to an
      # unmanaged store, which is exactly what happened before this step existed.
      - name: Resolve bootstrap artefact bucket
        id: bootstrap
        run: |
          set -euo pipefail
          # `|| outputs='[]'` so a missing stack reaches the guard below (which explains the fix)
          # instead of aborting on a raw ValidationError under `set -e`. The AWS error itself is
          # still printed to the log. `.[]?` does the same for a stack that has no outputs at all.
          outputs=$(aws cloudformation describe-stacks \
            --region ap-southeast-2 \
            --stack-name nzimageapi-bootstrap \
            --query 'Stacks[0].Outputs' --output json) || outputs='[]'
          bucket=$(echo "$outputs" | jq -r '[.[]? | select(.OutputKey=="ArtifactBucketName") | .OutputValue] | first // ""')
          if [ -z "$bucket" ] || [ "$bucket" = "null" ]; then
            echo "::error::nzimageapi-bootstrap did not return ArtifactBucketName. Deploy the bootstrap stack first: aws cloudformation deploy --region ap-southeast-2 --stack-name nzimageapi-bootstrap --template-file infra/bootstrap.yaml"
            exit 1
          fi
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "Artefact bucket: $bucket"
      - name: sam deploy
        run: |
          sam deploy \
            --stack-name nzimageapi \
            --region ap-southeast-2 \
            --s3-bucket ${{ steps.bootstrap.outputs.bucket }} \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ConverterSigningKey=${{ secrets.CONVERTER_SIGNING_KEY }} \
              AlarmEmail=${{ vars.ALARM_EMAIL }}
      # The Worker can't read stack outputs, so worker/wrangler.jsonc hardcodes the converter's
      # Function URL. A deploy that replaces the function changes it, and the Worker would keep
      # signing URLs for a host that no longer exists. Fail loudly instead.
      - name: Check the Worker's converter URL
        run: |
          url=$(aws cloudformation describe-stacks --region ap-southeast-2 --stack-name nzimageapi \
            --query "Stacks[0].Outputs[?OutputKey=='Jp2ConverterUrl'].OutputValue" --output text)
          if ! grep -qF "\"JP2_CONVERTER_URL\": \"$url\"" worker/wrangler.jsonc; then
            echo "::error::Jp2ConverterUrl is now $url. Set JP2_CONVERTER_URL in worker/wrangler.jsonc to it, and Workers Builds then redeploys the Worker."
            exit 1
          fi
