AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Deploy-artefact storage for the nzimageapi SAM stack: the SAM artefact bucket,
  with a retention lifecycle policy. (It also held the converter's ECR repository
  until the converter became a .zip in October 2026.)

  This is deliberately a SEPARATE stack from template.yaml, not part of it.
  `sam deploy` uploads the packaged code and template to S3 BEFORE CloudFormation
  runs, so the bucket cannot live in the stack that consumes it - it would not
  exist yet at upload time. Hence a small bootstrap
  stack, deployed once with plain `aws cloudformation deploy`, that the main stack's
  samconfig.toml then points at.

  Deploy:
    aws cloudformation deploy \
      --region ap-southeast-2 \
      --stack-name nzimageapi-bootstrap \
      --template-file infra/bootstrap.yaml

  Then wire the outputs into samconfig.toml - see
  .claude/rules/build-test-deploy.md, "Deploy artefact retention (cost control)".

Parameters:
  ArtifactRetentionDays:
    Type: Number
    Default: 60
    MinValue: 1
    Description: >
      How long SAM build artefacts live in the bucket. A stack update failing more
      than this many days after the deploy that produced its artefact cannot roll
      back to it, which is far outside any realistic rollback window here.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "nzimageapi-sam-artifacts-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-sam-artifacts
            Status: Enabled
            ExpirationInDays: !Ref ArtifactRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

Outputs:
  ArtifactBucketName:
    Description: Value for samconfig.toml s3_bucket (replaces resolve_s3 = true)
    Value: !Ref ArtifactBucket
