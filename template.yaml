AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  NZ Image API stack: the DigitalNZ random-image Swift Lambda (HTTP API) plus a
  self-hosted Python + Pillow JP2->JPEG converter Lambda (Function URL), deployed
  together as one stack. The Swift Lambda stays a pure URL builder; for TAPUHI it
  emits <converter Function URL>/?url=<encoded NDHA FL JP2 stream> and the browser
  loads the converter, which decodes the JP2 to a displayable JPEG.

Parameters:
  DigitalNzApiKey:
    Type: String
    NoEcho: true
    Description: >
      DigitalNZ API key (sent as the Authentication-Token header). Pass at deploy time
      via --parameter-overrides or the gitignored samconfig.toml. NEVER commit it.
  ApiClientSecrets:
    Type: String
    NoEcho: true
    Description: >
      Comma-separated "name:secret" pairs, one per approved consumer of the `/image` API
      (e.g. "site:AbC123...,mobile:XyZ789..."). The Swift Lambda requires the `secret`
      request header to constant-time-match one entry's secret; the matching entry's name
      is logged as the authorized consumer. Generate each secret with `openssl rand -hex 32`
      (hex only -- ":" and "," are the field/entry delimiters). See docs/ACCESS-CONTROL.md
      for onboarding/revoking a consumer. Pass at deploy time via --parameter-overrides or
      the gitignored samconfig.toml. NEVER commit it.
  AlarmEmail:
    Type: String
    Description: >
      Email address subscribed to the cost/abuse CloudWatch alarms and the monthly Budget
      notification (see docs/ACCESS-CONTROL.md, "Cost controls"). AWS sends a subscription-
      confirmation email to this address after the first deploy -- it must be confirmed
      before notifications will deliver.
  ConverterSigningKey:
    Type: String
    NoEcho: true
    Description: >
      HMAC key shared between the Swift Lambda (signs converter URLs) and the converter
      Lambda (verifies them), so the public converter Function URL only accepts requests
      the Swift Lambda minted. Pass at deploy time via --parameter-overrides or the
      gitignored samconfig.toml. NEVER commit it.
  ConverterSpikeThreshold:
    Type: Number
    Default: 100
    Description: >
      Converter invocations in 5 minutes above which the spike alarm fires and
      ConverterGuardFunction switches the converter off.
  GuardMaxGbSeconds:
    Type: Number
    Default: 320000
    Description: >
      Month-to-date Lambda compute (GB-seconds, all functions) at which the converter is
      switched off. The always-free allowance is 400,000, and the gap absorbs the guard's hourly
      lag and the Duration metric not counting init time.
  GuardMaxRequests:
    Type: Number
    Default: 800000
    Description: >
      Month-to-date Lambda requests (all functions) at which the converter is switched off.
      The always-free allowance is 1,000,000.
  GuardMaxConverterInvocations:
    Type: Number
    Default: 20000
    Description: >
      Month-to-date converter invocations at which it is switched off. This bounds data
      transfer out, which has no CloudWatch metric: each response is at most ~4 MB, so 20,000
      stays under the 100 GB a month AWS includes for free.

  GuardSpikeCooldownHours:
    Type: Number
    Default: 6
    Description: >
      Hours after the spike alarm last fired before the hourly guard run may switch the
      converter back on. Throttled calls don't count as invocations, so the alarm itself clears
      within minutes and can't be used to tell that a flood has stopped.

Resources:
  # --- Cost/abuse notifications: one SNS topic, emailed on any alarm or budget breach ---
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: nzimageapi-cost-alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # A $1/month trip-wire: this stack is meant to run entirely within AWS's perpetual free
  # tiers, so ANY real spend means something is misbehaving (see docs/ACCESS-CONTROL.md,
  # "Cost controls"). Notifies at 100% of the $1 limit, both actual and forecasted.
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: nzimageapi-monthly-cost-tripwire
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 1
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail

  # --- JP2 -> JPEG converter (.zip + public Function URL) ------------------------------
  # A .zip (not a container image) so there is no ECR repo to pay for: ECR's free storage is a
  # 12-month offer this account no longer has, while Lambda's .zip code storage is included.
  Jp2ConverterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: converter/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 2048          # Lambda CPU scales with memory; headroom for large JP2 masters
      # NDHA streams some masters to the Lambda at under 1 MB/s, so a 45 MB master can need
      # ~60 s just to download. app.py gives up once a read returns after DOWNLOAD_DEADLINE (90 s),
      # and one read can block for up to DOWNLOAD_TIMEOUT (35 s), so a download ends by ~125 s.
      # That leaves ~55 s for decode/encode.
      Timeout: 180
      # No ReservedConcurrentExecutions in the template: this account's total Lambda concurrency
      # quota is only 10 (not the usual 1000 default) and must stay fully unreserved. The only
      # reservation ever made is 0, set at runtime by ConverterGuardFunction as a kill switch,
      # which CloudFormation does not track.
      Environment:
        Variables:
          # Host allowlist for the master->JPEG proxy (comma-separated). NDHA for TAPUHI's
          # JP2 FL streams; feildingheritage.nz for Feilding Library's TIFF originals; also
          # War Art Online (ndhadeliver, already listed) and Manawatū Heritage's TIFF originals
          # (the download endpoint 302-redirects to its own presigned S3 store, followed transparently).
          ALLOWED_HOSTS: "ndhadeliver.natlib.govt.nz,www.feildingheritage.nz,feildingheritage.nz,manawatuheritage.pncc.govt.nz"
          MAX_DIM: "4000"
          CONVERTER_SIGNING_KEY: !Ref ConverterSigningKey
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET
    Metadata:
      BuildMethod: makefile     # converter/Makefile: installs Pillow's aarch64 wheel on any host

  # Fires when the converter -- the expensive function -- is hammered. It emails AlarmTopic and,
  # through the same topic, wakes ConverterGuardFunction, which switches the converter off. A
  # 5-minute period means a flood is cut off within minutes rather than at the end of an hour.
  # Normal use is about 16 conversions an hour per open slideshow tab.
  Jp2ConverterInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nzimageapi-converter-invocations-high
      AlarmDescription: !Sub Jp2ConverterFunction invoked more than ${ConverterSpikeThreshold} times in 5 minutes. ConverterGuardFunction switches it off.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref Jp2ConverterFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ConverterSpikeThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # --- Free-tier kill switch for the converter ----------------------------------------
  # The converter's Function URL is public, so nothing else caps what it can cost. This function
  # sets the converter's reserved concurrency to 0 (every call is throttled, nothing is billed)
  # when the spike alarm fires, and checks month-to-date usage every hour against limits set
  # below Lambda's always-free allowance. The hourly run switches the converter back on once
  # usage is under the limits again (a new month) and the spike alarm has been quiet for
  # GuardSpikeCooldownHours. See guard/app.py.
  ConverterGuardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: guard/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 60
      Environment:
        Variables:
          CONVERTER_FUNCTION_NAME: !Ref Jp2ConverterFunction
          SPIKE_ALARM_NAME: !Ref Jp2ConverterInvocationsAlarm
          ALERT_TOPIC_ARN: !Ref AlarmTopic
          MAX_GB_SECONDS: !Ref GuardMaxGbSeconds
          MAX_REQUESTS: !Ref GuardMaxRequests
          MAX_CONVERTER_INVOCATIONS: !Ref GuardMaxConverterInvocations
          SPIKE_COOLDOWN_HOURS: !Ref GuardSpikeCooldownHours
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:GetFunctionConcurrency
                - lambda:PutFunctionConcurrency
                - lambda:DeleteFunctionConcurrency
              Resource: !GetAtt Jp2ConverterFunction.Arn
            - Effect: Allow
              Action:
                - lambda:ListFunctions
                - cloudwatch:GetMetricStatistics
                - cloudwatch:DescribeAlarms
                - cloudwatch:DescribeAlarmHistory
              Resource: "*"
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlarmTopic.TopicName
      Events:
        Hourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
        SpikeAlarm:
          Type: SNS
          Properties:
            Topic: !Ref AlarmTopic
            # Only the spike alarm entering ALARM wakes the guard. Other alarms, budget mail and
            # the guard's own plain-text notices on this topic are dropped at the subscription.
            FilterPolicyScope: MessageBody
            FilterPolicy:
              AlarmName:
                - !Ref Jp2ConverterInvocationsAlarm
              NewStateValue:
                - ALARM
    Metadata:
      BuildMethod: makefile

  # --- Swift NZ Image API (provided.al2023 custom runtime, built via the Makefile) -------
  NZImageApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 60
      # No ReservedConcurrentExecutions: see the matching comment on Jp2ConverterFunction --
      # this account's total Lambda concurrency quota is only 10, already fully unreserved,
      # and is itself the binding concurrency ceiling right now.
      Environment:
        Variables:
          DIGITALNZ_API_KEY: !Ref DigitalNzApiKey
          API_CLIENT_SECRETS: !Ref ApiClientSecrets
          CONVERTER_SIGNING_KEY: !Ref ConverterSigningKey
          LOG_LEVEL: info
          # Injected from the converter's Function URL (no hardcoding / chicken-and-egg).
          # SAM auto-creates AWS::Lambda::Url with logical id <FunctionLogicalId>Url.
          JP2_CONVERTER_URL: !GetAtt Jp2ConverterFunctionUrl.FunctionUrl
      Events:
        Image:
          Type: HttpApi
          Properties:
            Path: /image
            Method: GET
        Collections:
          Type: HttpApi
          Properties:
            Path: /collections
            Method: GET
    Metadata:
      BuildMethod: makefile

  # Fires if the Swift API is invoked more than 200 times in any 1-hour window. Since the
  # secret check happens before any DigitalNZ call, an unauthorized flood is cheap per-call
  # but this still flags unexpected volume from an authorized-but-misbehaving consumer.
  NZImageApiInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nzimageapi-api-invocations-high
      AlarmDescription: NZImageApiFunction invoked more than 200 times in 1 hour.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref NZImageApiFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Explicit declaration of the implicit HTTP API (must keep the logical id "ServerlessHttpApi"
  # so SAM customizes -- rather than replaces -- the API the Image event already targets; the
  # live URL is unaffected). DefaultRouteSettings caps request *rate*; the account's total Lambda
  # concurrency quota (currently 10 -- see the comments on Jp2ConverterFunction/NZImageApiFunction)
  # currently caps *parallelism* -- together they bound worst-case cost even for a valid caller.
  ServerlessHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingRateLimit: 10    # steady-state requests/sec; tune to expected legitimate traffic
        ThrottlingBurstLimit: 20   # token-bucket burst capacity

Outputs:
  ImageApiEndpoint:
    Description: Random-image endpoint (send the `secret` header) — the new SAM HTTP API URL.
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/image"
  Jp2ConverterUrl:
    Description: JP2->JPEG converter Function URL (wired into the Swift Lambda's JP2_CONVERTER_URL).
    Value: !GetAtt Jp2ConverterFunctionUrl.FunctionUrl
  AlarmTopicArn:
    Description: >
      SNS topic for cost/abuse alarms and the monthly budget tripwire. Confirm the subscription
      email sent to AlarmEmail after the first deploy, or notifications won't deliver.
    Value: !Ref AlarmTopic
